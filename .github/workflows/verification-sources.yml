# Vérification à blanc des sources de données, lancée à la main depuis GitHub.
#
# Raison d'être : les scripts `npm run fred:check` et `npm run eurostat:check` ont besoin d'un
# accès réseau sortant vers les APIs publiques. Ce workflow l'apporte sans rien installer sur
# une machine : onglet « Actions » du dépôt, « Vérification des sources », « Run workflow ».
#
# Ne collecte rien, n'écrit ni en base ni dans la configuration. C'est un contrôle.

name: Vérification des sources

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Quelle source vérifier"
        type: choice
        required: true
        default: eurostat
        options:
          - eurostat
          - fred
          - les-deux
          - explorer-eurostat
          - sonder-hote
          - sonder-marche
          - sonder-page
          - sonder-twelvedata
          - twelve-data
          - fred-observation
          - twelve-data-observation
      series:
        description: "Séries à vérifier (vide = toutes). Explorer : « catalogue <terme> » ou « <dataset> <dimension> ». Sonder-hôte : l'hôte. Sonder-marché : rien. Sonder-page : une URL, ou « URL||motif-grep ». Sonder-twelvedata : rien (tous les candidats). Twelve-data : symbole(s), ex. XAU/USD. Fred-observation / twelve-data-observation : « ID(S)||AAAA-MM-JJ||AAAA-MM-JJ » (plusieurs séries séparées par une virgule, début||fin)"
        type: string
        required: false
        default: ""

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Eurostat
        if: ${{ inputs.source == 'eurostat' || inputs.source == 'les-deux' }}
        env:
          # Passé par l'environnement et non interpolé dans le script : une saisie libre ne doit
          # jamais devenir du shell.
          SERIES: ${{ inputs.series }}
        # `set +e` parce que GitHub lance ce script avec `bash -e` : sans ça, un script en échec
        # couperait avant d'avoir refermé le bloc du résumé. `pipefail` pour que le code de
        # sortie survive au `tee` — un run rouge doit rester rouge.
        run: |
          set +e -o pipefail
          {
            echo '## Eurostat'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run eurostat:check --silent -- $SERIES 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Exploration Eurostat
        # Sert quand un code est refusé ou manquant : on lit la nomenclature de la source au
        # lieu de deviner un remplaçant.
        if: ${{ inputs.source == 'explorer-eurostat' }}
        env:
          ARGS: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          {
            echo '## Exploration Eurostat'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run eurostat:explore --silent -- $ARGS 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Sonder un hôte
        # Répond à « ce service est-il joignable depuis l'internet public, maintenant ? ».
        # Un 401 est un succès : il prouve que l'hôte répond. Ce qu'on cherche à écarter, c'est
        # l'absence de réponse — projet en pause, nom qui ne résout pas.
        if: ${{ inputs.source == 'sonder-hote' }}
        env:
          HOTE: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          {
            echo '## Sonde'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "hôte : $HOTE"
            echo "--- résolution DNS ---"
            getent hosts "$HOTE" || echo "le nom ne résout pas"
            echo "--- réponse HTTP (10 s max) ---"
            curl -sS -o /dev/null -m 10 -w 'code=%{http_code}  temps=%{time_total}s\n' \
              "https://$HOTE/rest/v1/" || echo "aucune réponse"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Sonder les fournisseurs de marché
        # Lit la documentation et les pages de tarification réelles de Financial Modeling Prep
        # et Twelve Data — pas la connaissance générale du modèle, qui peut dater — et fait un
        # appel réel à chacune avec une clé de démonstration publique pour voir la réponse.
        #
        # `tee` plutôt qu'une redirection simple : le résultat doit apparaître à la fois dans le
        # résumé du run et dans les journaux, seuls lisibles par API sans accès au navigateur.
        if: ${{ inputs.source == 'sonder-marche' }}
        run: |
          set +e -o pipefail
          {
            echo '## Financial Modeling Prep'
            echo '### Page de tarification (texte extrait)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sL -m 15 "https://site.financialmodelingprep.com/pricing-plans" \
            | sed -e 's/<[^>]*>/ /g' -e 's/&amp;/\&/g' -e 's/&nbsp;/ /g' \
            | tr -s ' \t\n' ' \t\n' \
            | grep -iE 'free|/day|per day|requests|api call|rate limit|\$0|\$[0-9]' \
            | head -60 | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo '### Appel réel avec la clé de démonstration publique'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -m 15 -w '\nHTTP %{http_code}\n' \
            "https://financialmodelingprep.com/api/v3/quote/AAPL?apikey=demo" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

          {
            echo '## Twelve Data'
            echo '### Page de tarification (texte extrait)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sL -m 15 "https://twelvedata.com/pricing" \
            | sed -e 's/<[^>]*>/ /g' -e 's/&amp;/\&/g' -e 's/&nbsp;/ /g' \
            | tr -s ' \t\n' ' \t\n' \
            | grep -iE 'free|/day|per day|per minute|requests|api call|rate limit|\$0|\$[0-9]' \
            | head -60 | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo '### Appel réel avec la clé de démonstration publique'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -m 15 -w '\nHTTP %{http_code}\n' \
            "https://api.twelvedata.com/price?symbol=AAPL/USD&apikey=demo" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sonder une page
        # Générique, réutilisable pour n'importe quelle page de tarification ou de doc future —
        # même mécanique que la sonde des fournisseurs de marché, mais sur une URL donnée.
        # `series` accepte « URL » seule (mots-clés de tarification par défaut) ou
        # « URL||motif-grep » pour chercher autre chose, ex. une couverture d'instruments.
        if: ${{ inputs.source == 'sonder-page' }}
        env:
          RAW: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          URL="${RAW%%||*}"
          if [ "$RAW" != "$URL" ]; then PATTERN="${RAW#*||}"; else
            PATTERN='free|hobby|pro|enterprise|/mo|per month|\$0|\$[0-9]|cron'
          fi
          {
            echo "## $URL"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sL -m 15 -A "Mozilla/5.0" "$URL" \
            | sed -e 's/<[^>]*>/ /g' -e 's/&amp;/\&/g' -e 's/&nbsp;/ /g' \
            | tr -s ' \t\n' ' \t\n' \
            | grep -iE "$PATTERN" \
            | head -100 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sonder Twelve Data
        # Avant d'écrire `config/twelve-data-series.ts`, on découvre quels symboles la source
        # reconnaît réellement pour nos onze instruments manquants — indices propriétaires et
        # métaux compris — et si le palier gratuit les sert ou renvoie un refus de plan. Plusieurs
        # candidats par instrument : la nomenclature des indices n'est pas standardisée, mieux
        # vaut le lire que le deviner.
        if: ${{ inputs.source == 'sonder-twelvedata' }}
        env:
          APIKEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # Le palier gratuit plafonne à 8 appels par minute — confirmé par le premier passage.
          # `series` restreint la liste aux identifiants encore incertains, séparés par un
          # espace, pour rester sous ce plafond en un seul passage.
          ONLY: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          if [ -z "$APIKEY" ]; then
            echo "TWELVE_DATA_API_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Twelve Data — symboles candidats'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          declare -A CANDIDATES=(
            [sx5e]="STOXX50E SX5E"
            [ukx]="FTSE UKX"
            [cac]="FCHI PX1 CAC"
            [hsi]="HSI HANGSENG"
            [csi300]="000300 CSI300"
            [nifty50]="NSEI NIFTY50 NIFTY"
            [acwi]="ACWI"
            [gold]="XAU/USD"
            [silver]="XAG/USD"
            [copper]="XCU/USD HG1 COPPER"
            [dxy]="DXY USDX"
          )
          IDS="sx5e ukx cac hsi csi300 nifty50 acwi gold silver copper dxy"
          if [ -n "$ONLY" ]; then IDS="$ONLY"; fi
          {
            for id in $IDS; do
              for sym in ${CANDIDATES[$id]}; do
                echo "--- $id -> $sym ---"
                curl -sS -m 15 -G --data-urlencode "symbol=$sym" --data-urlencode "apikey=$APIKEY" \
                  "https://api.twelvedata.com/quote"
                echo
                sleep 8
              done
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Twelve Data
        # Exécute `npm run twelve-data:check`, le contrôle permanent — pas la sonde ad hoc
        # ci-dessus, gardée pour découvrir de nouveaux symboles. Même garde que FRED : la clé est
        # un secret du dépôt, son absence se dit au lieu d'échouer sur une erreur d'authentification.
        if: ${{ inputs.source == 'twelve-data' }}
        env:
          SERIES: ${{ inputs.series }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$TWELVE_DATA_API_KEY" ]; then
            echo "TWELVE_DATA_API_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Twelve Data'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          npm run twelve-data:check --silent -- $SERIES 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Observation FRED sur une fenêtre donnée
        # Pour lire une valeur historique précise (une base YTD par exemple) — `fred:check`
        # regarde toujours en arrière depuis aujourd'hui, borné par `LOOKBACK_DAYS`, donc
        # inadapté à une clôture d'il y a plusieurs mois. Appel direct, mêmes contraintes que
        # les autres sondes : ne collecte rien, n'écrit rien. Plusieurs séries séparées par une
        # virgule pour vérifier plusieurs bases YTD en un seul run.
        if: ${{ inputs.source == 'fred-observation' }}
        env:
          RAW: ${{ inputs.series }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SIDS="${RAW%%||*}"
          REST="${RAW#*||}"
          START="${REST%%||*}"
          END="${REST#*||}"
          {
            for SID in ${SIDS//,/ }; do
              echo "## FRED — $SID de $START à $END"
              echo '```'
              curl -sS -m 15 -G \
                --data-urlencode "series_id=$SID" \
                --data-urlencode "api_key=$FRED_API_KEY" \
                --data-urlencode "file_type=json" \
                --data-urlencode "observation_start=$START" \
                --data-urlencode "observation_end=$END" \
                --data-urlencode "sort_order=asc" \
                "https://api.stlouisfed.org/fred/series/observations"
              echo
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Observation Twelve Data sur une fenêtre donnée
        # Même besoin que la sonde FRED équivalente, pour or et MSCI ACWI (les deux seules
        # séries Twelve Data actives) : lire une clôture historique précise plutôt que le
        # dernier prix seul que `/quote` renvoie.
        if: ${{ inputs.source == 'twelve-data-observation' }}
        env:
          RAW: ${{ inputs.series }}
          APIKEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$APIKEY" ]; then
            echo "TWELVE_DATA_API_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SIDS="${RAW%%||*}"
          REST="${RAW#*||}"
          START="${REST%%||*}"
          END="${REST#*||}"
          {
            for SID in ${SIDS//,/ }; do
              echo "## Twelve Data — $SID de $START à $END"
              echo '```'
              curl -sS -m 15 -G \
                --data-urlencode "symbol=$SID" \
                --data-urlencode "interval=1day" \
                --data-urlencode "start_date=$START" \
                --data-urlencode "end_date=$END" \
                --data-urlencode "apikey=$APIKEY" \
                "https://api.twelvedata.com/time_series"
              echo
              echo '```'
              sleep 8
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: FRED
        # `always()` pour que FRED soit quand même vérifié après un Eurostat rouge.
        if: ${{ always() && (inputs.source == 'fred' || inputs.source == 'les-deux') }}
        env:
          SERIES: ${{ inputs.series }}
          # La clé FRED est un secret du dépôt. Sans elle, l'étape le dit au lieu d'échouer sur
          # une erreur d'authentification qu'on prendrait pour un problème de série.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY absente des secrets du dépôt — étape sautée." >> "$GITHUB_STEP_SUMMARY"
            echo "FRED_API_KEY absente des secrets du dépôt — étape sautée."
            exit 0
          fi
          {
            echo '## FRED'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run fred:check --silent -- $SERIES 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code
