# Vérification à blanc des sources de données, lancée à la main depuis GitHub.
#
# Raison d'être : les scripts `npm run fred:check` et `npm run eurostat:check` ont besoin d'un
# accès réseau sortant vers les APIs publiques. Ce workflow l'apporte sans rien installer sur
# une machine : onglet « Actions » du dépôt, « Vérification des sources », « Run workflow ».
#
# Ne collecte rien, n'écrit ni en base ni dans la configuration. C'est un contrôle.

name: Vérification des sources

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Quelle source vérifier"
        type: choice
        required: true
        default: eurostat
        options:
          - eurostat
          - ons
          - estat
          - fred
          - les-deux
          - explorer-eurostat
          - sonder-hote
          - sonder-marche
          - sonder-page
          - sonder-brut
          - sonder-supabase
          - sonder-twelvedata
          - twelve-data
          - fred-observation
          - twelve-data-observation
          - explorer-estat
          - estat-getdata
          - fred-release-dates
      series:
        description: "Séries à vérifier (vide = toutes). Explorer : « catalogue <terme> » ou « <dataset> <dimension> ». Sonder-hôte : l'hôte. Sonder-marché : rien. Sonder-page : une URL, ou « URL||motif-grep ». Sonder-twelvedata : rien (tous les candidats). Twelve-data : symbole(s), ex. XAU/USD. Fred-observation / twelve-data-observation : « ID(S)||AAAA-MM-JJ||AAAA-MM-JJ » (plusieurs séries séparées par une virgule, début||fin)"
        type: string
        required: false
        default: ""
        # Sonder-brut : « URL » seule, ou « URL||motif-grep » — pas de tag-stripping HTML, pour
        # une réponse JSON ou XML de structure (SDMX) dont l'information vit dans les attributs,
        # que « sonder-page » aplatirait en la vidant de son contenu utile.
        # Sonder-supabase : « table?filtre-PostgREST », ex.
        # « series_health?target_id=eq.us-wages&select=*» ou
        # « macro_observations?indicator_id=eq.us-wages&select=*&order=date.desc&limit=5 ».
        # Lecture seule, clé anonyme — les mêmes tables que la barre de fraîcheur et /triage.
        # Explorer-estat : « terme-de-recherche » ou « terme||limite » (japonais recommandé,
        # e-Stat indexe peu en anglais) ; « code:00450071||limite » liste toutes les tables d'un
        # statsCode de relevé sans filtre de titre. Estat-getdata : « statsDataId » ou
        # « statsDataId||cdArea=...&cdCat01=...&cdTime=... » pour filtrer avant lecture.
        # Fred-release-dates : un ou plusieurs series_id séparés par une virgule — résout le
        # « release » (le calendrier de publication) de chaque série puis liste ses prochaines
        # dates programmées, pour corriger `nextRelease` sans deviner.

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Eurostat
        if: ${{ inputs.source == 'eurostat' || inputs.source == 'les-deux' }}
        env:
          # Passé par l'environnement et non interpolé dans le script : une saisie libre ne doit
          # jamais devenir du shell.
          SERIES: ${{ inputs.series }}
        # `set +e` parce que GitHub lance ce script avec `bash -e` : sans ça, un script en échec
        # couperait avant d'avoir refermé le bloc du résumé. `pipefail` pour que le code de
        # sortie survive au `tee` — un run rouge doit rester rouge.
        run: |
          set +e -o pipefail
          {
            echo '## Eurostat'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run eurostat:check --silent -- $SERIES 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: ONS
        if: ${{ inputs.source == 'ons' }}
        env:
          SERIES: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          {
            echo '## ONS'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run ons:check --silent -- $SERIES 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: e-Stat
        # Exécute `npm run estat:check`, le contrôle permanent — pas les sondes ad hoc
        # `explorer-estat` / `estat-getdata` ci-dessous, gardées pour découvrir de nouvelles
        # tables. Même garde que FRED : la clé (`appId`) est un secret du dépôt, son absence se
        # dit au lieu d'échouer sur une erreur d'authentification.
        if: ${{ inputs.source == 'estat' }}
        env:
          SERIES: ${{ inputs.series }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          set +e -o pipefail
          if [ -z "$ESTAT_APP_ID" ]; then
            echo "ESTAT_APP_ID absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## e-Stat'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          npm run estat:check --silent -- $SERIES 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Exploration Eurostat
        # Sert quand un code est refusé ou manquant : on lit la nomenclature de la source au
        # lieu de deviner un remplaçant.
        if: ${{ inputs.source == 'explorer-eurostat' }}
        env:
          ARGS: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          {
            echo '## Exploration Eurostat'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run eurostat:explore --silent -- $ARGS 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Sonder un hôte
        # Répond à « ce service est-il joignable depuis l'internet public, maintenant ? ».
        # Un 401 est un succès : il prouve que l'hôte répond. Ce qu'on cherche à écarter, c'est
        # l'absence de réponse — projet en pause, nom qui ne résout pas.
        if: ${{ inputs.source == 'sonder-hote' }}
        env:
          HOTE: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          {
            echo '## Sonde'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "hôte : $HOTE"
            echo "--- résolution DNS ---"
            getent hosts "$HOTE" || echo "le nom ne résout pas"
            echo "--- réponse HTTP (10 s max) ---"
            curl -sS -o /dev/null -m 10 -w 'code=%{http_code}  temps=%{time_total}s\n' \
              "https://$HOTE/rest/v1/" || echo "aucune réponse"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Sonder les fournisseurs de marché
        # Lit la documentation et les pages de tarification réelles de Financial Modeling Prep
        # et Twelve Data — pas la connaissance générale du modèle, qui peut dater — et fait un
        # appel réel à chacune avec une clé de démonstration publique pour voir la réponse.
        #
        # `tee` plutôt qu'une redirection simple : le résultat doit apparaître à la fois dans le
        # résumé du run et dans les journaux, seuls lisibles par API sans accès au navigateur.
        if: ${{ inputs.source == 'sonder-marche' }}
        run: |
          set +e -o pipefail
          {
            echo '## Financial Modeling Prep'
            echo '### Page de tarification (texte extrait)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sL -m 15 "https://site.financialmodelingprep.com/pricing-plans" \
            | sed -e 's/<[^>]*>/ /g' -e 's/&amp;/\&/g' -e 's/&nbsp;/ /g' \
            | tr -s ' \t\n' ' \t\n' \
            | grep -iE 'free|/day|per day|requests|api call|rate limit|\$0|\$[0-9]' \
            | head -60 | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo '### Appel réel avec la clé de démonstration publique'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -m 15 -w '\nHTTP %{http_code}\n' \
            "https://financialmodelingprep.com/api/v3/quote/AAPL?apikey=demo" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

          {
            echo '## Twelve Data'
            echo '### Page de tarification (texte extrait)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sL -m 15 "https://twelvedata.com/pricing" \
            | sed -e 's/<[^>]*>/ /g' -e 's/&amp;/\&/g' -e 's/&nbsp;/ /g' \
            | tr -s ' \t\n' ' \t\n' \
            | grep -iE 'free|/day|per day|per minute|requests|api call|rate limit|\$0|\$[0-9]' \
            | head -60 | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo '### Appel réel avec la clé de démonstration publique'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -m 15 -w '\nHTTP %{http_code}\n' \
            "https://api.twelvedata.com/price?symbol=AAPL/USD&apikey=demo" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sonder une page
        # Générique, réutilisable pour n'importe quelle page de tarification ou de doc future —
        # même mécanique que la sonde des fournisseurs de marché, mais sur une URL donnée.
        # `series` accepte « URL » seule (mots-clés de tarification par défaut) ou
        # « URL||motif-grep » pour chercher autre chose, ex. une couverture d'instruments.
        if: ${{ inputs.source == 'sonder-page' }}
        env:
          RAW: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          URL="${RAW%%||*}"
          if [ "$RAW" != "$URL" ]; then PATTERN="${RAW#*||}"; else
            PATTERN='free|hobby|pro|enterprise|/mo|per month|\$0|\$[0-9]|cron'
          fi
          {
            echo "## $URL"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sL -m 15 -A "Mozilla/5.0" "$URL" \
            | sed -e 's/<[^>]*>/ /g' -e 's/&amp;/\&/g' -e 's/&nbsp;/ /g' \
            | tr -s ' \t\n' ' \t\n' \
            | grep -iE "$PATTERN" \
            | head -100 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sonder brut
        # Sans tag-stripping : nécessaire pour une réponse SDMX (JSON de structure ou XML), dont
        # les identifiants vivent dans les attributs — que « sonder une page » viderait de tout
        # contenu utile en aplatissant les balises. `jq` si la réponse est du JSON valide
        # (préinstallé sur ubuntu-latest). Fenêtre de 6000 caractères, décalable : « URL »,
        # « URL||motif-grep » ou « URL||motif-grep||décalage » pour paginer une longue réponse
        # structurelle sans la re-télécharger avec un décalage différent à chaque fois — le motif
        # peut rester vide (« URL||||6000 ») pour juste avancer dans le brut.
        if: ${{ inputs.source == 'sonder-brut' }}
        env:
          RAW: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          URL="${RAW%%||*}"
          REST="${RAW#*||}"
          if [ "$RAW" != "$URL" ]; then
            PATTERN="${REST%%||*}"
            SKIP="${REST#*||}"
            if [ "$SKIP" = "$REST" ]; then SKIP=0; fi
          else
            PATTERN=""
            SKIP=0
          fi
          [ -n "$SKIP" ] || SKIP=0
          {
            echo "## $URL (décalage $SKIP)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          BODY=$(curl -sL -m 15 -A "Mozilla/5.0" "$URL")
          PRETTY=$(printf '%s' "$BODY" | jq . 2>/dev/null)
          if [ -n "$PRETTY" ]; then BODY="$PRETTY"; fi
          # Un codelist SDMX tient sur une seule ligne XML : sans ce découpage, un motif de grep
          # ne filtre rien, il ne fait que décider si la ligne entière (donc tout le document)
          # s'affiche. Un saut de ligne avant chaque <str:Code redonne un code par ligne — sans
          # effet sur du JSON, où cette sous-chaîne n'apparaît jamais.
          BODY=$(printf '%s' "$BODY" | sed 's/<str:Code /\n<str:Code /g')
          if [ -n "$PATTERN" ]; then
            printf '%s\n' "$BODY" | grep -iE "$PATTERN" | tail -c "+$((SKIP + 1))" | head -c 6000
          else
            printf '%s\n' "$BODY" | tail -c "+$((SKIP + 1))" | head -c 6000
          fi | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sonder Supabase
        # Lecture seule sur ce que la clé anonyme peut déjà voir — les mêmes tables et la même
        # clé que la barre de fraîcheur et /triage, RLS de `supabase/schema.sql` à l'appui.
        # Sert à répondre à « la collecte a-t-elle vraiment écrit cette valeur ? » sans
        # attendre un accès au tableau de bord Supabase ou à Vercel.
        if: ${{ inputs.source == 'sonder-supabase' }}
        env:
          RAW: ${{ inputs.series }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL ou SUPABASE_ANON_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Supabase — $RAW"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          BASE="${SUPABASE_URL%/}"
          # `SUPABASE_URL` peut être le « Project URL » nu (…supabase.co) ou déjà terminé par
          # `/rest/v1` selon l'écran du tableau de bord d'où il a été copié. On tente les deux
          # plutôt que de deviner, et on dit laquelle a fonctionné.
          if [[ "$BASE" == */rest/v1 ]]; then
            URL1="$BASE/$RAW"
            URL2="${BASE%/rest/v1}/rest/v1/$RAW"
          else
            URL1="$BASE/rest/v1/$RAW"
            URL2="$BASE/$RAW"
          fi
          BODY=$(curl -sS -m 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$URL1")
          if printf '%s' "$BODY" | grep -q '"code":"PGRST125"'; then
            echo "(URL1 invalide, tentative avec le préfixe /rest/v1 inversé)"
            BODY=$(curl -sS -m 15 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$URL2")
          fi
          PRETTY=$(printf '%s' "$BODY" | jq . 2>/dev/null)
          if [ -n "$PRETTY" ]; then BODY="$PRETTY"; fi
          printf '%s\n' "$BODY" | head -c 6000 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sonder Twelve Data
        # Avant d'écrire `config/twelve-data-series.ts`, on découvre quels symboles la source
        # reconnaît réellement pour nos onze instruments manquants — indices propriétaires et
        # métaux compris — et si le palier gratuit les sert ou renvoie un refus de plan. Plusieurs
        # candidats par instrument : la nomenclature des indices n'est pas standardisée, mieux
        # vaut le lire que le deviner.
        if: ${{ inputs.source == 'sonder-twelvedata' }}
        env:
          APIKEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # Le palier gratuit plafonne à 8 appels par minute — confirmé par le premier passage.
          # `series` restreint la liste aux identifiants encore incertains, séparés par un
          # espace, pour rester sous ce plafond en un seul passage.
          ONLY: ${{ inputs.series }}
        run: |
          set +e -o pipefail
          if [ -z "$APIKEY" ]; then
            echo "TWELVE_DATA_API_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Twelve Data — symboles candidats'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          declare -A CANDIDATES=(
            [sx5e]="STOXX50E SX5E"
            [ukx]="FTSE UKX"
            [cac]="FCHI PX1 CAC"
            [hsi]="HSI HANGSENG"
            [csi300]="000300 CSI300"
            [nifty50]="NSEI NIFTY50 NIFTY"
            [acwi]="ACWI"
            [gold]="XAU/USD"
            [silver]="XAG/USD"
            [copper]="XCU/USD HG1 COPPER"
            [dxy]="DXY USDX"
          )
          IDS="sx5e ukx cac hsi csi300 nifty50 acwi gold silver copper dxy"
          if [ -n "$ONLY" ]; then IDS="$ONLY"; fi
          {
            for id in $IDS; do
              for sym in ${CANDIDATES[$id]}; do
                echo "--- $id -> $sym ---"
                curl -sS -m 15 -G --data-urlencode "symbol=$sym" --data-urlencode "apikey=$APIKEY" \
                  "https://api.twelvedata.com/quote"
                echo
                sleep 8
              done
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Twelve Data
        # Exécute `npm run twelve-data:check`, le contrôle permanent — pas la sonde ad hoc
        # ci-dessus, gardée pour découvrir de nouveaux symboles. Même garde que FRED : la clé est
        # un secret du dépôt, son absence se dit au lieu d'échouer sur une erreur d'authentification.
        if: ${{ inputs.source == 'twelve-data' }}
        env:
          SERIES: ${{ inputs.series }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$TWELVE_DATA_API_KEY" ]; then
            echo "TWELVE_DATA_API_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Twelve Data'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          npm run twelve-data:check --silent -- $SERIES 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Observation FRED sur une fenêtre donnée
        # Pour lire une valeur historique précise (une base YTD par exemple) — `fred:check`
        # regarde toujours en arrière depuis aujourd'hui, borné par `LOOKBACK_DAYS`, donc
        # inadapté à une clôture d'il y a plusieurs mois. Appel direct, mêmes contraintes que
        # les autres sondes : ne collecte rien, n'écrit rien. Plusieurs séries séparées par une
        # virgule pour vérifier plusieurs bases YTD en un seul run. Quatrième segment optionnel
        # (« SID||début||fin||unités ») pour reproduire la transformation réellement demandée
        # par `config/fred-series.ts` (`pc1` par exemple) — sans lui, FRED répond en niveau
        # brut, ce qui ne se compare pas à une valeur stockée en glissement annuel.
        if: ${{ inputs.source == 'fred-observation' }}
        env:
          RAW: ${{ inputs.series }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SIDS="${RAW%%||*}"
          REST="${RAW#*||}"
          START="${REST%%||*}"
          REST2="${REST#*||}"
          END="${REST2%%||*}"
          UNITS="${REST2#*||}"
          if [ "$UNITS" = "$END" ]; then UNITS="lin"; fi
          {
            for SID in ${SIDS//,/ }; do
              echo "## FRED — $SID de $START à $END (units=$UNITS)"
              echo '```'
              curl -sS -m 15 -G \
                --data-urlencode "series_id=$SID" \
                --data-urlencode "api_key=$FRED_API_KEY" \
                --data-urlencode "file_type=json" \
                --data-urlencode "units=$UNITS" \
                --data-urlencode "observation_start=$START" \
                --data-urlencode "observation_end=$END" \
                --data-urlencode "sort_order=asc" \
                "https://api.stlouisfed.org/fred/series/observations"
              echo
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Observation Twelve Data sur une fenêtre donnée
        # Même besoin que la sonde FRED équivalente, pour or et MSCI ACWI (les deux seules
        # séries Twelve Data actives) : lire une clôture historique précise plutôt que le
        # dernier prix seul que `/quote` renvoie.
        if: ${{ inputs.source == 'twelve-data-observation' }}
        env:
          RAW: ${{ inputs.series }}
          APIKEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$APIKEY" ]; then
            echo "TWELVE_DATA_API_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SIDS="${RAW%%||*}"
          REST="${RAW#*||}"
          START="${REST%%||*}"
          END="${REST#*||}"
          {
            for SID in ${SIDS//,/ }; do
              echo "## Twelve Data — $SID de $START à $END"
              echo '```'
              curl -sS -m 15 -G \
                --data-urlencode "symbol=$SID" \
                --data-urlencode "interval=1day" \
                --data-urlencode "start_date=$START" \
                --data-urlencode "end_date=$END" \
                --data-urlencode "apikey=$APIKEY" \
                "https://api.twelvedata.com/time_series"
              echo
              echo '```'
              sleep 8
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Explorer e-Stat
        # Recherche de tables statistiques par mot-clé, avant d'écrire config/estat-series.ts —
        # même prudence que pour Eurostat : on lit le catalogue réel plutôt que de deviner un
        # identifiant de table (statsDataId). e-Stat indexe surtout en japonais, un mot-clé
        # anglais renvoie souvent zéro résultat.
        if: ${{ inputs.source == 'explorer-estat' }}
        env:
          RAW: ${{ inputs.series }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          set +e -o pipefail
          if [ -z "$ESTAT_APP_ID" ]; then
            echo "ESTAT_APP_ID absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          WORD="${RAW%%||*}"
          REST="${RAW#*||}"
          LIMIT=10
          if [ "$RAW" != "$WORD" ]; then LIMIT="$REST"; fi
          # « code:00450071 » à la place d'un mot-clé : liste toutes les tables d'un statsCode de
          # relevé (STAT_NAME.@code trouvé par une recherche précédente), sans filtre de titre —
          # utile quand le mot-clé fait remonter du bruit thématique voisin plutôt que la table
          # maîtresse cherchée. « code:00450071:mot-clé » combine les deux : ne liste que les
          # tables de ce relevé dont le titre correspond, pour filtrer un relevé qui porte des
          # milliers de tables historiques sans se noyer dedans.
          ARGS=(--data-urlencode "appId=$ESTAT_APP_ID" --data-urlencode "limit=$LIMIT")
          if [[ "$WORD" == code:* ]]; then
            CODEPART="${WORD#code:}"
            STATSCODE="${CODEPART%%:*}"
            ARGS+=(--data-urlencode "statsCode=$STATSCODE")
            if [ "$CODEPART" != "$STATSCODE" ]; then
              ARGS+=(--data-urlencode "searchWord=${CODEPART#*:}")
            fi
          else
            ARGS+=(--data-urlencode "searchWord=$WORD")
          fi
          {
            echo "## e-Stat — recherche « $WORD » (limite $LIMIT)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          BODY=$(curl -sS -m 45 -G "${ARGS[@]}" "https://api.e-stat.go.jp/rest/3.0/app/json/getStatsList")
          # Vue condensée (id, intitulé, cycle, mise à jour) : la réponse brute est tronquée à
          # 6000 caractères plus bas, et un TABLE_INF complet ne laisse passer que deux ou trois
          # entrées avant la coupe — largement insuffisant pour repérer la bonne table dans une
          # liste par statsCode.
          PRETTY=$(printf '%s' "$BODY" | jq '
            (.GET_STATS_LIST.DATALIST_INF.TABLE_INF // .GET_STATS_LIST.RESULT) as $t
            | if ($t | type) == "array" then
                $t | map({
                  id: .["@id"],
                  stat: .STAT_NAME["$"],
                  name: .STATISTICS_NAME,
                  title: (if (.TITLE | type) == "object" then .TITLE["$"] else .TITLE end),
                  cycle: .CYCLE,
                  updated: .UPDATED_DATE
                })
              else $t end
          ' 2>/dev/null)
          if [ -z "$PRETTY" ] || [ "$PRETTY" = "null" ]; then PRETTY="$BODY"; fi
          printf '%s\n' "$PRETTY" | head -c 6000 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Données e-Stat pour une table
        # Une fois un `statsDataId` candidat trouvé par la recherche ci-dessus, cette étape lit
        # ses vraies données et sa nomenclature (`metaGetFlg=Y`) — nécessaire parce que les codes
        # de zone, de catégorie et de temps d'e-Stat sont propres à chaque table, à l'inverse des
        # dimensions Eurostat qui suivent une convention commune. Segment « grep:motif » dans
        # EXTRA pour chercher un poste précis dans un CLASS_INF trop long pour la troncature.
        if: ${{ inputs.source == 'estat-getdata' }}
        env:
          RAW: ${{ inputs.series }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          set +e -o pipefail
          if [ -z "$ESTAT_APP_ID" ]; then
            echo "ESTAT_APP_ID absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATSID="${RAW%%||*}"
          EXTRA="${RAW#*||}"
          if [ "$RAW" = "$STATSID" ]; then EXTRA=""; fi
          # Segment « grep:motif » optionnel dans EXTRA : filtre la réponse par motif avant la
          # troncature à 6000 caractères — indispensable pour une table comme le CPI, dont
          # CLASS_INF liste des centaines de postes et noierait le code cherché.
          GREP=""
          NEWEXTRA=""
          IFS='&' read -ra PAIRS <<< "$EXTRA"
          for p in "${PAIRS[@]}"; do
            [ -z "$p" ] && continue
            if [[ "$p" == grep:* ]]; then
              GREP="${p#grep:}"
            else
              NEWEXTRA="$NEWEXTRA&$p"
            fi
          done
          EXTRA="$NEWEXTRA"
          {
            echo "## e-Stat — getStatsData $STATSID ($EXTRA) grep=$GREP"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ARGS=(--data-urlencode "appId=$ESTAT_APP_ID" --data-urlencode "statsDataId=$STATSID" --data-urlencode "metaGetFlg=Y" --data-urlencode "limit=30")
          IFS='&' read -ra PAIRS <<< "$EXTRA"
          for p in "${PAIRS[@]}"; do
            [ -z "$p" ] && continue
            k="${p%%=*}"; v="${p#*=}"
            ARGS+=(--data-urlencode "$k=$v")
          done
          BODY=$(curl -sS -m 45 -G "${ARGS[@]}" "https://api.e-stat.go.jp/rest/3.0/app/json/getStatsData")
          PRETTY=$(printf '%s' "$BODY" | jq . 2>/dev/null)
          if [ -z "$PRETTY" ]; then PRETTY="$BODY"; fi
          if [ -n "$GREP" ]; then
            printf '%s\n' "$PRETTY" | grep -iE -B2 -A2 "$GREP" | head -c 6000 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$PRETTY" | head -c 6000 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: FRED
        # `always()` pour que FRED soit quand même vérifié après un Eurostat rouge.
        if: ${{ always() && (inputs.source == 'fred' || inputs.source == 'les-deux') }}
        env:
          SERIES: ${{ inputs.series }}
          # La clé FRED est un secret du dépôt. Sans elle, l'étape le dit au lieu d'échouer sur
          # une erreur d'authentification qu'on prendrait pour un problème de série.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY absente des secrets du dépôt — étape sautée." >> "$GITHUB_STEP_SUMMARY"
            echo "FRED_API_KEY absente des secrets du dépôt — étape sautée."
            exit 0
          fi
          {
            echo '## FRED'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run fred:check --silent -- $SERIES 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Dates de publication FRED
        # Pour corriger `nextRelease` dans data/seed.json sans deviner : résout le release_id de
        # chaque série (le calendrier de publication auquel elle appartient — plusieurs séries
        # partagent le même, ex. CPIAUCSL et CPILFESL viennent toutes deux du même « Consumer
        # Price Index »), puis liste les prochaines dates programmées de ce release.
        if: ${{ inputs.source == 'fred-release-dates' }}
        env:
          RAW: ${{ inputs.series }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e -o pipefail
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY absente des secrets du dépôt — étape sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          {
            for SID in ${RAW//,/ }; do
              echo "## FRED — $SID"
              echo '```'
              REL=$(curl -sS -m 15 -G \
                --data-urlencode "series_id=$SID" \
                --data-urlencode "api_key=$FRED_API_KEY" \
                --data-urlencode "file_type=json" \
                "https://api.stlouisfed.org/fred/series/release")
              echo "$REL" | jq -c '.releases[]? | {id: .id, name: .name}' 2>/dev/null || echo "$REL"
              RELEASE_ID=$(echo "$REL" | jq -r '.releases[0].id // empty' 2>/dev/null)
              if [ -n "$RELEASE_ID" ]; then
                DATES=$(curl -sS -m 15 -G \
                  --data-urlencode "release_id=$RELEASE_ID" \
                  --data-urlencode "api_key=$FRED_API_KEY" \
                  --data-urlencode "file_type=json" \
                  --data-urlencode "include_release_dates_with_no_data=true" \
                  --data-urlencode "realtime_start=$TODAY" \
                  --data-urlencode "limit=5" \
                  "https://api.stlouisfed.org/fred/release/dates")
                echo "prochaines dates du release $RELEASE_ID :"
                echo "$DATES" | jq -c '.release_dates[]?.date' 2>/dev/null || echo "$DATES"
              fi
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
